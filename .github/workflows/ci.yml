# Runs npm run check on every push to any branch. It needs no secrets.
name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A run takes about 20 minutes, mostly the end-to-end tests one at a time.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit on every branch, for gitleaks' history scan.
          fetch-depth: 0

      # Secrets first, before anything else is installed, so a leak fails the run in a minute.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks" && cd "$RUNNER_TEMP/gitleaks"
          release="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
          curl -sSfLO "$release/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$release/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan the repo for secrets
        run: gitleaks git . --redact --verbose --no-banner

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      # The latest uv. It installs the Python in .python-version itself.
      - uses: astral-sh/setup-uv@v10.4.0

      - name: Install the npm packages
        run: npm ci

      # The end-to-end tests use the Google Chrome already on GitHub's Ubuntu runner.
      - name: npm run check
        run: npm run check

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          # A run that fails before the end-to-end tests has no report.
          if-no-files-found: ignore
